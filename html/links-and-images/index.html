<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <a href="https://www.theodinproject.com/about">About the odin project</a>
    <!-- href = Hypertext Reference-->
    <!-- open a link in current tab use _self using target attribute -->
    <div>
      <a href="https://www.theodinproject.com" target="_self"
        >open in current tab</a
      >
    <div>
      <a href="https://www.theodinproject.com" target="_blank"
        >open in new tab</a
      >
    </div>
    <!-- Absolute link -->
    <a href="https://www.theodinproject.com/about">About The Odin Project</a>
    <!-- Relative links -->
    <a href="page/about.html">About</a>

    <!-- add images -->
     <img src="image/images/dog.jpg (2).jpg" alt="dog">
     <H2>Parent directory</H2>
    <img src="../image/images/dog.jpg (2).jpg" /> <!-- ../ help to go the parent diretory-->
  <!-- alt attribute -->
<img src="testing" alt="page not found">  

<!-- image size attributes -->
 <h3>image size attributes</h3>
 <img src="https://www.theodinproject.com/mstile-310x310.png" alt="logo" height="310" width="310"> 
</body>
</html>
